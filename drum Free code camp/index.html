<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="drum-machine">
        <div id="pad-bank">
            <div class="drum-pad"><audio src="Q" class="clip" id="Q"></audio><button>Q</button></div>
            <div class="drum-pad"><audio src="W" class="clip" id="W"></audio><button>W</button></div>
            <div class="drum-pad"><audio src="E" class="clip" id="E"></audio><button>E</button></div>
            <div class="drum-pad"><audio src="A" class="clip" id="A"></audio><button>A</button></div>
            <div class="drum-pad"><audio src="S" class="clip" id="S"></audio><button>S</button></div>
            <div class="drum-pad"><audio src="D" class="clip" id="D"></audio><button>D</button></div>
            <div class="drum-pad"><audio src="Z" class="clip" id="Z"></audio><button>Z</button></div>
            <div class="drum-pad"><audio src="X" class="clip" id="X"></audio><button>X</button></div>
            <div class="drum-pad"><audio src="C" class="clip" id="C"></audio><button>C</button></div>
        </div>
        <p id="display"></p>
    </div>
</body>
<!-- <script src="script.js"></script> -->
</html>
